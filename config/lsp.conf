# Языковые серверы для go-to-definition в review и log.
#
# Формат: блок открывает строка «server <язык>», дальше поля с
# отступом. Уровни конфигов, ближний перекрывает дальний по полям:
#   этот файл → ~/.config/familiar/lsp.conf → <репо>/.familiar/lsp.conf
#
# Поля:
#   extensions     расширения файлов (составное важнее простого)
#   language       languageId для сервера, если не совпадает с языком
#   command        как запустить сервер
#   install        чем ставить: «brew <формула>» или «npm <пакет>»
#   shebang        имена интерпретаторов для файлов без
#                  расширения (bin/familiar, git-хуки)
#
# Подстановки в значениях: ${CACHE} — каталог индекса этого проекта,
# ${SERVERS} — куда «familiar lsp install» ставит npm-серверы,
# ${ROOT} — корень проекта, ${HOME}, ${env:VAR}.
#   roots          маркеры корня проекта
#   roots-mode     nearest (по умолчанию) | git — всегда корень репо
#   initopt K V    initializationOptions, ключ через точку вложенный
#   setting K V    ответ на workspace/configuration
#   busy / ready   нестандартные нотификации о начале и конце
#                  индексации — для серверов, которые не шлют
#                  $/progress (intelephense шлёт, ему не нужно)
#   timeout        секунды на запрос определения
#   shutdown-wait  сколько ждать вежливого завершения
#   disabled yes   выключить блок
#
# Языка нет в списке — «familiar lsp status» напечатает заготовку.

server php
  extensions     .php .phtml .blade.php
  shebang        php
  command        intelephense --stdio
  install        npm intelephense
  roots          composer.json
  initopt        storagePath ${CACHE}
  initopt        licenceKey ${env:INTELEPHENSE_LICENCE}
  # сканирование дерева повторяется при каждом старте: каталоги,
  # где кода нет, стоит не обходить вовсе
  setting        intelephense.files.exclude **/.git/** **/node_modules/**
  setting        intelephense.files.exclude **/bower_components/** **/.history/**
  setting        intelephense.files.exclude **/vendor/**/{Tests,tests}/**
  setting        intelephense.files.exclude **/vendor/**/vendor/**
  setting        intelephense.files.exclude **/storage/** **/bootstrap/cache/**

# Свободная замена intelephense: MIT и без node, но слабее на магии
# фреймворков. Включается переносом «disabled yes» в блок выше.
server php-phpactor
  disabled       yes
  extensions     .php .phtml .blade.php
  language       php
  command        phpactor language-server
  install        brew phpactor
  roots          composer.json

server python
  extensions     .py .pyi
  shebang        python python3
  command        pyright-langserver --stdio
  install        brew pyright
  roots          pyproject.toml setup.py setup.cfg requirements.txt

server typescript
  extensions     .ts .tsx .js .jsx .mjs .cjs
  shebang        node
  command        typescript-language-server --stdio
  install        brew typescript-language-server
  roots          tsconfig.json jsconfig.json package.json

server go
  extensions     .go
  command        gopls
  install        brew gopls
  roots          go.work go.mod
  shutdown-wait  0.1

server rust
  extensions     .rs
  command        rust-analyzer
  install        brew rust-analyzer
  roots          Cargo.toml

server ruby
  extensions     .rb .rake .gemspec
  shebang        ruby
  command        ruby-lsp
  install        brew ruby-lsp
  roots          Gemfile .ruby-version

server lua
  extensions     .lua
  command        lua-language-server
  install        brew lua-language-server
  roots          .luarc.json

server java
  extensions     .java
  command        jdtls
  install        brew jdtls
  roots          pom.xml build.gradle build.gradle.kts settings.gradle
  timeout        10

server c
  extensions     .c .h .cc .cpp .hpp .cxx .m .mm
  language       cpp
  command        clangd
  install        brew llvm
  roots          compile_commands.json CMakeLists.txt Makefile

server kotlin
  extensions     .kt .kts
  command        kotlin-language-server
  install        brew kotlin-language-server
  roots          build.gradle.kts settings.gradle.kts pom.xml

server zig
  extensions     .zig
  command        zls
  install        brew zls
  roots          build.zig

server bash
  extensions     .sh .bash .zsh
  shebang        bash sh zsh
  language       shellscript
  command        bash-language-server start
  install        npm bash-language-server
  roots          .git

# Идёт с Xcode, отдельной установки не требует.
server swift
  extensions     .swift
  command        xcrun sourcekit-lsp
  install        xcode
  roots          Package.swift

# ───────────────────────────── прочие ─────────────────────────────

server elixir
  extensions     .ex .exs
  command        elixir-ls
  install        brew elixir-ls
  roots          mix.exs

server haskell
  extensions     .hs .lhs
  command        haskell-language-server-wrapper --lsp
  install        brew haskell-language-server
  roots          cabal.project stack.yaml package.yaml

server scala
  extensions     .scala .sbt .sc
  command        metals
  install        brew metals
  roots          build.sbt build.sc build.mill

server clojure
  extensions     .clj .cljs .cljc .edn
  command        clojure-lsp
  install        brew clojure-lsp
  roots          deps.edn project.clj

server terraform
  extensions     .tf .tfvars
  command        terraform-ls serve
  install        brew terraform-ls
  roots          .terraform.lock.hcl main.tf

server markdown
  extensions     .md .markdown
  command        marksman server
  install        brew marksman
  roots          .git

server perl
  extensions     .pl .pm .t
  command        perlnavigator --stdio
  install        brew perlnavigator
  shebang        perl
  roots          cpanfile Makefile.PL

# ─────────────────────────── веб-стек ───────────────────────────

server vue
  extensions     .vue
  command        vue-language-server --stdio
  install        npm @vue/language-server
  roots          package.json
  # сервер Vue работает поверх tsserver и просит показать, где тот
  # лежит; его ставит typescript-language-server, рядом
  initopt        typescript.tsdk ${SERVERS}/lib/node_modules/typescript/lib

server svelte
  extensions     .svelte
  command        svelteserver --stdio
  install        npm svelte-language-server
  roots          svelte.config.js package.json

server dockerfile
  extensions     dockerfile .dockerfile
  language       dockerfile
  command        docker-langserver --stdio
  install        npm dockerfile-language-server-nodejs
  roots          .git

server yaml
  extensions     .yaml .yml
  command        yaml-language-server --stdio
  install        brew yaml-language-server
  roots          .git

server json
  extensions     .json .jsonc
  command        vscode-json-language-server --stdio
  install        brew vscode-langservers-extracted
  roots          package.json .git

server html
  extensions     .html .htm
  command        vscode-html-language-server --stdio
  install        brew vscode-langservers-extracted
  roots          package.json .git

server css
  extensions     .css .scss .less
  command        vscode-css-language-server --stdio
  install        brew vscode-langservers-extracted
  roots          package.json .git
