# Защита от случайного закрытия.
# Дефолт kitty (confirm_os_window_close -1) спрашивает, только когда в
# окне запущены программы; окно с десятком табов, где всюду просто
# шелл, закрывается молча. Значение 2 — спрашивать всегда, если табов
# больше одного.
confirm_os_window_close 2

# Cmd+W закрывает панель (splits.conf). Здесь тот же биндинг с
# подтверждением — ignore-shell, чтобы пустую панель на промпте
# по-прежнему закрывать одним нажатием, а спрашивало только там, где
# что-то запущено (claude, nvim, тесты).
# Работает лишь при подключении ПОСЛЕ splits.conf: у kitty выигрывает
# последний map на клавишу.
map --allow-fallback=ascii cmd+w close_window_with_confirmation ignore-shell

# Оба уточнения — ПОСЛЕ безусловного map: из подходящих kitty берёт
# последний объявленный (`matches[-1]` в matching_key_actions), а
# безусловный подходит всегда и снизу перекрыл бы любое условие.

# Повтор в открытом вопросе: kitty рисует его оверлеем со своим китом
# `ask`, и каждое следующее нажатие клало бы поверх ещё один — нажав
# Cmd+W пять раз, пришлось бы пять раз отвечать.
# Матч — по аргументу `ask` целиком: cmdline сверяется с КАЖДЫМ
# аргументом отдельно, поэтому шаблон на всю строку («kitten … ask»)
# не совпал бы ни с чем, а `kitten` поймал бы и наши киты.
map --when-focus-on cmdline:^ask$ --allow-fallback=ascii cmd+w discard_event

# В оверлее кита Cmd+W закрывает сам кит — тем же ⌃c, что и его футер.
# Убить окно вопросом нельзя: оверлей открыт цепочкой `goto_layout
# stack`, и layout возвращает handle_result кита (modules/overlay.py) —
# при закрытии в обход кита таб так и остался бы стопкой.
map --when-focus-on var:cc_plugin --allow-fallback=ascii cmd+w send_text all \x03
