# Сплиты окон (панелей) в стиле Ghostty.
# splits — основной layout; stack — «развернуть» активный сплит на весь экран.
enabled_layouts splits:split_axis=horizontal,stack

# Создать сплит (в рабочей папке активного окна).
# last_reported, а не current: current берёт cwd «самого нового» процесса окна,
# а рядом с Claude Code, постоянно плодящим короткоживущие процессы, это
# лотерея. last_reported берёт папку, которую окно сообщило само (шлёт shell
# integration на промпте, а в окнах сессии — session.py), и лишь без отчёта
# откатывается на процессы.
map cmd+d       launch --location=vsplit --cwd=last_reported
map cmd+shift+d launch --location=hsplit --cwd=last_reported
# Дубли для русской раскладки (D = в)
map cmd+в       launch --location=vsplit --cwd=last_reported
map cmd+shift+в launch --location=hsplit --cwd=last_reported

# Переход между сплитами — Cmd+Shift+стрелки (как в Ghostty)
map cmd+shift+left  neighboring_window left
map cmd+shift+right neighboring_window right
map cmd+shift+up    neighboring_window up
map cmd+shift+down  neighboring_window down

# Развернуть активный сплит на весь экран и обратно
map cmd+shift+enter toggle_layout stack

# Вынести активный сплит в отдельный таб. ask, а не new-tab: kitty
# спрашивает куда (новый таб, новое окно, любой открытый), и тем же
# хоткеем сплит возвращается обратно. Cmd+Shift+T занят снимком
# restore, отсюда Cmd+Ctrl+T; ascii-fallback — по причине из блока
# Cmd+W ниже.
map --allow-fallback=ascii cmd+ctrl+t detach_window ask
# Вопрос kitty рисует оверлеем кита hints, и повторное нажатие клало
# бы поверх ещё один (та же история, что с Cmd+W в safety.conf).
# Уточнение обязано идти ПОСЛЕ безусловного map: из подходящих kitty
# берёт последний объявленный.
map --when-focus-on cmdline:^hints$ --allow-fallback=ascii cmd+ctrl+t discard_event

# Cmd+W — закрыть панель; последняя в табе -> закроется таб, затем окно.
# allow-fallback=ascii, а не кириллический дубль: на русской раскладке физическая W
# даёт «ц», и прямой map cmd+ц на macOS съедает input method (проверено через
# --debug-keyboard: «handled as shortcut» без действия). ascii-fallback заранее
# конвертит физическую W в латинскую и матчит close_window — путь надёжный.
# Работает только потому, что дефолтный cmd+w -> close_tab снят в restored-defaults.conf.
map --allow-fallback=ascii cmd+w       close_window
# Cmd+Shift+W — закрыть весь таб целиком (со всеми сплитами)
map --allow-fallback=ascii cmd+shift+w close_tab
